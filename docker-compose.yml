version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/dev.env
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - CORS_ORIGINS=http://localhost
    volumes:
      - backend-data:/data
    x-preview-port: 8000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - BACKEND_HOST=backend
    ports:
      - "80:80"
    depends_on:
      - backend
    x-preview-port: 80

volumes:
  backend-data:
