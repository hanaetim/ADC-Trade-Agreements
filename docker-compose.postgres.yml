version: '3.8'

services:
  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=adc_agreements
      - POSTGRES_USER=adc_user
      - POSTGRES_PASSWORD=adc_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    environment:
      - DATABASE_URL=postgresql+psycopg://adc_user:adc_password@database:5432/adc_agreements
    build:
      args:
        - PIP_TARGET=.[postgres]
    depends_on:
      - database

volumes:
  postgres-data:
