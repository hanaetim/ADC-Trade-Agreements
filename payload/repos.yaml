schema: appkit-repos-v1
topology: multi
repositories:
  - name: iaom-backend
    role: application
    workspace_path: repos/iaom-backend
    source: greenfield
    description: Python/Anthropic-SDK backend for the International Agreements & Origin workflows — agents AGN1-AGN6, the Deterministic Rule Engine, MCP tools TOL1-TOL8 against mocked systems of record, business rules, state machines, and the immutable audit trail.
  - name: iaom-frontend
    role: application
    workspace_path: repos/iaom-frontend
    source: greenfield
